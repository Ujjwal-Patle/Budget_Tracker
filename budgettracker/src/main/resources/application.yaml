spring:
  application:
    name: budgettracker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budget_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tiger}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080


management:
   endpoints:
     web:
       exposure:
         include: health

app:
  jwt:
    secret: ${JWT_SECRET:mBWBoI70EktEhCMJZW87mPmZvcf/dDiRWf+mKeDc6Xs=}
    expiration-ms: 900000

logging:
  level:
    org:
      springframework:
        security=DEBUG: